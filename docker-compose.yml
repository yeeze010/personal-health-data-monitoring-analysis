services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8206:8206"
    environment:
      - HOST=0.0.0.0
      - PORT=8206
      - BOOTSTRAP_USER_USERNAME=${BOOTSTRAP_USER_USERNAME:-personal.user}
      - BOOTSTRAP_USER_PASSWORD=${BOOTSTRAP_USER_PASSWORD:?BOOTSTRAP_USER_PASSWORD must be set}
      - BOOTSTRAP_ADMIN_USERNAME=${BOOTSTRAP_ADMIN_USERNAME:-system.admin}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD must be set}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://127.0.0.1:5206,http://localhost:5206}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5206:5206"
    depends_on:
      - api
    restart: unless-stopped
